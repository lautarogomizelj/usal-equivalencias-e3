# Stack de desarrollo. Los valores por defecto son solo locales: en producción
# se definen por variables de ambiente (README, "Variables de Ambiente Requeridas").
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:-e3}
      POSTGRES_USER: ${DB_USERNAME:-e3}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-e3_dev}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-e3} -d ${DB_NAME:-e3}"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-e3_dev}
    ports:
      - "5050:80"
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
      target: app
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev,docker}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-e3}
      DB_USERNAME: ${DB_USERNAME:-e3}
      DB_PASSWORD: ${DB_PASSWORD:-e3_dev}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
